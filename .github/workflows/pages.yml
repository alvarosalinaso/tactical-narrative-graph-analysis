name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish output/grafo_tactico.html
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-pages@v4
      - name: Stage site (entry point grafo_tactico.html)
        run: |
          mkdir -p _site
          cp output/grafo_tactico.html _site/index.html
          cp output/grafo_tactico_canada.html _site/grafo_tactico_canada.html
          cp output/grafo_tactico_morocco.html _site/grafo_tactico_morocco.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
