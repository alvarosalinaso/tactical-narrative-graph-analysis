[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Umbral de cobertura exigido por pytest-cov (--cov-fail-under).
# No baja umbrales de otros repos; se eligio 60% como piso razonable.
fail_under = 60
show_missing = true
